name: Python Package CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      
      # Core blocking checks
      - name: "Repository Integrity (blocking)"
        run: pre-commit run --hook-stage default --all-files
      
      # Advisory type checking (not blocking)
      - name: "Type Checking Report (advisory)"
        continue-on-error: true
        run: |
          echo "## Type Checking Summary" >> $GITHUB_STEP_SUMMARY
          mypy . 2>&1 | tee /tmp/mypy-report.txt || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total type errors:** $(grep -c '^' /tmp/mypy-report.txt || echo 0)" >> $GITHUB_STEP_SUMMARY
      
      # Advisory linting report
      - name: "Lint Report (advisory)"
        continue-on-error: true
        run: |
          echo "## Linting Summary" >> $GITHUB_STEP_SUMMARY
          ruff check . 2>&1 | tee /tmp/ruff-report.txt || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ruff issues:** $(grep -c '^' /tmp/ruff-report.txt || echo 0)" >> $GITHUB_STEP_SUMMARY

  test:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: "Run tests on ${{ matrix.os }}"
        run: python -m pytest -q --tb=short
